<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCARS Looseleaf • Star Trek Adventures Table Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Michroma&display=swap"
    rel="stylesheet">
  <style>
    /* ==========================================================================
       THELCARS.COM AUTHENTIC PALETTES & VARIABLES
       ========================================================================== */
    :root,
    [data-theme="classic-tng"] {
      --bg: #000000;
      --panel-bg: #000000;
      --c-primary: #ff9900;
      /* Gold / Orange */
      --c-secondary: #cc99cc;
      /* Lilac / Lavender */
      --c-tertiary: #9999ff;
      /* Periwinkle Blue */
      --c-accent: #ff9966;
      /* Peach / Coral */
      --c-alert: #cc6666;
      /* Mars Red */
      --c-ok: #99cc99;
      /* Bio Green */
      --c-muted: #ffcc99;
      --text-main: #f4f1ea;
      --text-dim: var(--c-secondary);
    }

    [data-theme="nemesis-blue"] {
      --bg: #000000;
      --panel-bg: #000000;
      --c-primary: #3c9ee6;     /* Sovereign Sky Cerulean (25835-284 / lower elbow / back-panel arcs) */
      --c-secondary: #3358d4;   /* Royal Cobalt (TARGETING ARRAY / VECTOR / DELTA V / PRIMARY SYS) */
      --c-tertiary: #67747f;    /* Slate Charcoal (36872-352 / squared end blocks) */
      --c-accent: #c9a46f;      /* Sand / Tan (78356-664 / short divider pips) */
      --c-alert: #b65a3a;       /* Rust Terracotta (AUXILIARY SYS / 10-00 pills) */
      --c-ok: #c3d6e4;          /* Pale Ice (TRAJECTORY / SENSOR MODE) */
      --c-muted: #7fa6d6;       /* Sensor-Mode Steel Blue */
      --text-main: #dde9f5;     /* Cool CRT Ice-White */
      --text-dim: #7fa6d6;
    }

    /* Lower Decks (Cerritos) palette — sampled from the animated bridge/briefing
       displays (ENGINEERING, LUNAR DEMOLITION, shuttle front panel): flat orange,
       amber and butterscotch cel-shaded blocks on a deep navy-indigo screen. */
    [data-theme="lower-decks"] {
      --bg: #0d0f24;            /* Cerritos screen navy */
      --panel-bg: #0d0f24;
      --c-primary: #f2782a;     /* Cerritos Orange (elbows / main bars) */
      --c-secondary: #f5ae35;   /* Amber Butterscotch (rail blocks / pills) */
      --c-tertiary: #dc5524;    /* Burnt Red-Orange (deep rail blocks / pill tips) */
      --c-accent: #ece18e;      /* Pale Lime-Yellow (pips / thin rules / titles) */
      --c-alert: #ff3b30;
      --c-ok: #8fd47a;
      --c-muted: #f7cf82;       /* Light Butterscotch */
      --text-main: #f4ecc9;     /* Cream title yellow (ENGINEERING / LUNAR DEMOLITION) */
      --text-dim: #f5ae35;
    }

    /* Voyager (Intrepid) palette — sampled from HYDROTRANSFER SIMULATION 1105,
       transporter room controls and the bridge rear/tactical consoles */
    [data-theme="voyager"] {
      --c-primary: #8ea6f2;     /* Periwinkle Cornflower (upper elbow / console keys) */
      --c-secondary: #d99a8b;   /* Dusty Rose / Salmon (lower elbow / rail blocks) */
      --c-tertiary: #c39ad0;    /* Lilac Mauve (top rail block / short bar segments) */
      --c-accent: #e9b04f;      /* Butterscotch Gold (rail blocks / square pips) */
      --c-alert: #f0602a;       /* Transporter Orange square keys */
      --c-ok: #a4cff2;          /* Pale Sky Blue (status pills) */
      --c-muted: #bcc1c9;       /* Intrepid Silver-Grey (large console blocks) */
      --text-main: #f1ece4;
      --text-dim: #e9b04f;
    }

    /* ==========================================================================
       GLOBAL RED ALERT MODE OVERLAY (Applies on top of ANY theme & shape profile)
       ========================================================================== */
    body[data-alert="red"] {
      --c-primary: #dd2222 !important;     /* Klaxon Crimson */
      --c-secondary: #ff7722 !important;   /* Tactical Amber */
      --c-tertiary: #8899aa !important;    /* Titanium Alert Grey */
      --c-accent: #ffcc44 !important;      /* Warning Yellow */
      --c-alert: #ff1111 !important;       /* Bright Flash Red */
      --c-ok: #f4f1ea !important;          /* High-Contrast White Strobe */
      --c-muted: #ff8866 !important;
      --text-dim: #ff9966 !important;
    }

    /* Era-specific Red Alert nuances */
    /* Excelsior "ALERT / CONDITION RED": orange-red bars striped with white,
       cyan-blue CRT outlines kept, red-orange readout numerals */
    body[data-shape="tmp-era"][data-alert="red"] {
      --c-primary: #4a8cff !important;     /* Frame outlines stay CRT blue */
      --c-secondary: #ff4a26 !important;   /* Condition Red bars */
      --c-tertiary: #f0f0f0 !important;    /* White stripe keys */
      --c-accent: #ff8a3a !important;
      --c-ok: #ffd7cc !important;
      --c-muted: #c2391c !important;
      --text-main: #ffe4dc !important;
      --text-dim: #ff6a45 !important;
    }

    body[data-shape="picard-v2"][data-alert="red"] {
      --bg: #090304 !important;
      --c-primary: #ff1e1e !important;
      --c-secondary: #4a5060 !important;   /* Darkened gunmetal under red klaxon */
      --c-tertiary: #8a1c1c !important;
      --c-accent: #ff5533 !important;
    }

    /* Nemesis tactical red alert: crimson blocks + pale blush/cream keys, sand pips,
       burnt-umber end blocks (SHORT-RANGE SCAN 1028 / tactical red alert stills) */
    body[data-shape="nemesis"][data-alert="red"] {
      --c-primary: #d0303a !important;     /* Sovereign Tactical Crimson */
      --c-secondary: #b0464c !important;   /* Burgundy Rose (bright enough for black labels) */
      --c-tertiary: #5a2a1e !important;    /* Burnt Umber end blocks */
      --c-accent: #d98a3d !important;      /* Alert Amber pips */
      --c-alert: #ff3b3b !important;       /* Active Alert Red */
      --c-ok: #ecd9d3 !important;          /* Pale Blush / Cream keys */
      --c-muted: #c99a96 !important;       /* Dusty Rose */
      --text-main: #f4e4df !important;
      --text-dim: #e8a49a !important;
    }

    @keyframes lcars-red-alert-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.28); }
    }

    body[data-alert="red"] .frame-elbow-top,
    body[data-alert="red"] .frame-elbow-bot,
    body[data-alert="red"] .junction-elbow,
    body[data-alert="red"] #red-alert-footer-btn {
      animation: lcars-red-alert-pulse 1.8s infinite ease-in-out;
    }

    body[data-alert="red"] #red-alert-footer-btn {
      background: var(--text-main) !important;
      color: #cc0000 !important;
      box-shadow: 0 0 10px rgba(255, 30, 30, 0.7);
    }

    /* USS Excelsior bridge (ST VI / VOY "Flashback"): electric-blue outlined CRT
       frames, phosphor-green and cyan key blocks, lime/yellow markers and green
       monospace readouts ("SUBSYSTEM STATUS 0587.4"). */
    [data-theme="tmp-era"] {
      --c-primary: #2f6dff;     /* Electric Blue frame outlines */
      --c-secondary: #45d06c;   /* Phosphor Green key blocks */
      --c-tertiary: #5bb8ef;    /* CRT Cyan key blocks */
      --c-accent: #c9df4a;      /* Lime-Yellow markers (helm triangles) */
      --c-alert: #ff4a26;       /* Condition Red orange-red */
      --c-ok: #8fe8a0;          /* Pale Phosphor Green */
      --c-muted: #2f9e58;       /* Deep Phosphor Green */
      --text-main: #cdf5d4;     /* Green-white CRT text */
      --text-dim: #45d06c;
    }

    [data-theme="picard-v2"] {
      --bg: #12151b;            /* Smoked gunmetal console glass (wells & gaps match it) */
      --panel-bg: #12151b;
      --c-primary: #e7442a;     /* Picard Orange-Red (Primary / Active) */
      --c-secondary: #6d748c;   /* Gunmetal Slate Grey */
      --c-tertiary: #52596e;    /* Medium-Dark Structural Grey */
      --c-accent: #ff6753;      /* Light Orange-Red / Coral Highlight */
      --c-alert: #cc2233;       /* Tactical Crimson */
      --c-ok: #9ea5ba;          /* Cool Silver-Grey (Status OK) */
      --c-muted: #ff977b;       /* Pale Orange-Red */
      --text-main: #d2d5df;     /* Cool Ice-Grey Text */
      --text-dim: #9ea5ba;
    }

    /* ==========================================================================
       POSITIONAL COLOR PATTERN ENGINE (--pat-*)
       Decouples WHERE colors appear from the hex palette itself.
       Default (:root / tng) uses the classic 1701-D alternating rhythm.
       Each era overrides specific positional slots to match on-screen consoles.
       ========================================================================== */
    :root,
    [data-shape="tng"] {
      /* Frame Elbows & T-Junction Elbows */
      --pat-elbow-top:     var(--c-primary);
      --pat-elbow-bot:     var(--c-tertiary);
      --pat-junc-top:      var(--c-tertiary);
      --pat-junc-bot:      var(--c-tertiary);

      /* Crossbar Divider Top Rule (Row 1) */
      --pat-div1-lead:     var(--c-accent);
      --pat-div1-pip:      var(--c-secondary);
      --pat-div1-main:     var(--c-tertiary);
      --pat-div1-cap:      var(--c-secondary);

      /* Crossbar Divider Bottom Rule (Row 2) */
      --pat-div2-lead:     var(--c-accent);
      --pat-div2-pip:      var(--c-secondary);
      --pat-div2-main:     var(--c-primary);
      --pat-div2-cap:      var(--c-primary);

      /* Header Attribute & Department Stat Pills */
      --pat-hdr-attr-lbl:  var(--c-secondary);
      --pat-hdr-attr-tail: var(--c-tertiary);
      --pat-hdr-dept-lbl:  var(--c-primary);
      --pat-hdr-dept-tail: var(--c-tertiary);

      /* Left Navigation Rail Buttons (1–8) & Spacer */
      --pat-rail-1:        var(--c-secondary);
      --pat-rail-2:        var(--c-primary);
      --pat-rail-3:        var(--c-accent);
      --pat-rail-4:        var(--c-tertiary);
      --pat-rail-5:        var(--c-secondary);
      --pat-rail-6:        var(--c-accent);
      --pat-rail-7:        var(--c-muted);
      --pat-rail-8:        var(--c-secondary);
      --pat-rail-spacer:   var(--c-tertiary);

      /* Workspace Panel Brackets (Panel 1, Panel 2, Panel 3) */
      --pat-panel-1-main:  var(--c-secondary);
      --pat-panel-1-cap:   var(--c-primary);
      --pat-panel-2-main:  var(--c-tertiary);
      --pat-panel-2-cap:   var(--c-accent);

      /* Bottom Footer Bar Segments */
      --pat-foot-1:        var(--c-tertiary);
      --pat-foot-2:        var(--c-secondary);
      --pat-foot-3:        var(--c-accent);
      --pat-foot-end:      var(--c-primary);
    }

    /* --------------------------------------------------------------------------
       1. LOWER DECKS (CERRITOS) PATTERN OVERRIDE
       LUNAR DEMOLITION briefing display: burnt-orange top block (01-6134),
       orange elbows with paired thick+thin bars, butterscotch/amber stacked rail
       blocks (02-4687 / 03-0301 / 04-0606) and pale-yellow pips and rules.
       -------------------------------------------------------------------------- */
    [data-shape="lower-decks"],
    [data-theme="lower-decks"] {
      --pat-elbow-top:     var(--c-primary);    /* Orange top-left block (01-6134) */
      --pat-elbow-bot:     var(--c-secondary);  /* Butterscotch base block (04-0606) */
      --pat-junc-top:      var(--c-tertiary);   /* Burnt red-orange upper elbow */
      --pat-junc-bot:      var(--c-primary);    /* Cerritos orange lower elbow */

      /* Top rule: [amber] [pale-yellow] [orange long] [pale-yellow cap] */
      --pat-div1-lead:     var(--c-secondary);
      --pat-div1-pip:      var(--c-accent);
      --pat-div1-main:     var(--c-primary);
      --pat-div1-cap:      var(--c-accent);

      /* Bottom rule: [amber] [pale-yellow] [amber long] [orange cap] */
      --pat-div2-lead:     var(--c-secondary);
      --pat-div2-pip:      var(--c-accent);
      --pat-div2-main:     var(--c-secondary);
      --pat-div2-cap:      var(--c-primary);

      --pat-hdr-attr-lbl:  var(--c-secondary);
      --pat-hdr-attr-tail: var(--c-tertiary);
      --pat-hdr-dept-lbl:  var(--c-primary);
      --pat-hdr-dept-tail: var(--c-accent);

      --pat-rail-1:        var(--c-tertiary);   /* 02-4687 burnt orange */
      --pat-rail-2:        var(--c-primary);    /* 03-0301 orange */
      --pat-rail-3:        var(--c-secondary);  /* 04-0606 amber */
      --pat-rail-4:        var(--c-primary);
      --pat-rail-5:        var(--c-muted);
      --pat-rail-6:        var(--c-secondary);
      --pat-rail-7:        var(--c-tertiary);
      --pat-rail-8:        var(--c-accent);
      --pat-rail-spacer:   var(--c-secondary);

      --pat-panel-1-main:  var(--c-primary);
      --pat-panel-1-cap:   var(--c-accent);
      --pat-panel-2-main:  var(--c-secondary);
      --pat-panel-2-cap:   var(--c-tertiary);

      --pat-foot-1:        var(--c-primary);
      --pat-foot-2:        var(--c-accent);
      --pat-foot-3:        var(--c-secondary);
      --pat-foot-end:      var(--c-tertiary);
    }

    /* --------------------------------------------------------------------------
       2. VOYAGER (INTREPID-CLASS) PATTERN OVERRIDE
       HYDROTRANSFER SIMULATION 1105: lilac cap block over a periwinkle upper
       elbow, dusty-rose lower elbow, gold rail blocks at the base, and divider
       rules broken by a short gold square pip + lilac/rose short segment.
       -------------------------------------------------------------------------- */
    [data-shape="voyager"],
    [data-theme="voyager"] {
      --pat-elbow-top:     var(--c-tertiary);   /* Lilac cap block (top-left) */
      --pat-junc-top:      var(--c-primary);    /* Periwinkle upper elbow */
      --pat-junc-bot:      var(--c-secondary);  /* Dusty rose lower elbow */
      --pat-elbow-bot:     var(--c-accent);     /* Gold base block */

      /* Top rule: [gold pip] [lilac short] [periwinkle long] [rose cap] */
      --pat-div1-lead:     var(--c-accent);
      --pat-div1-pip:      var(--c-tertiary);
      --pat-div1-main:     var(--c-primary);
      --pat-div1-cap:      var(--c-secondary);

      /* Bottom rule: [gold pip] [rose short] [rose long] [gold cap] */
      --pat-div2-lead:     var(--c-accent);
      --pat-div2-pip:      var(--c-tertiary);
      --pat-div2-main:     var(--c-secondary);
      --pat-div2-cap:      var(--c-accent);

      --pat-hdr-attr-lbl:  var(--c-primary);
      --pat-hdr-attr-tail: var(--c-tertiary);
      --pat-hdr-dept-lbl:  var(--c-accent);
      --pat-hdr-dept-tail: var(--c-secondary);

      /* Rail descends lilac -> periwinkle -> rose -> gold, like the 1105 sidebar */
      --pat-rail-1:        var(--c-primary);
      --pat-rail-2:        var(--c-tertiary);
      --pat-rail-3:        var(--c-secondary);
      --pat-rail-4:        var(--c-secondary);
      --pat-rail-5:        var(--c-muted);
      --pat-rail-6:        var(--c-accent);
      --pat-rail-7:        var(--c-ok);
      --pat-rail-8:        var(--c-accent);
      --pat-rail-spacer:   var(--c-accent);

      --pat-panel-1-main:  var(--c-primary);
      --pat-panel-1-cap:   var(--c-accent);
      --pat-panel-2-main:  var(--c-secondary);
      --pat-panel-2-cap:   var(--c-tertiary);

      --pat-foot-1:        var(--c-secondary);
      --pat-foot-2:        var(--c-tertiary);
      --pat-foot-3:        var(--c-accent);
      --pat-foot-end:      var(--c-primary);
    }

    /* --------------------------------------------------------------------------
       3. NEMESIS (SOVEREIGN-CLASS) PATTERN OVERRIDE
       Screen-accurate to Enterprise-E bridge consoles (INTERNAL SYS SCAN 015 &
       ROMULAN NEUTRAL ZONE): Deep Cobalt upper elbow, Cerulean lower elbow,
       short Ochre/Tan junction pips, and Charcoal/Ice/Tan/Rust rail rhythm.
       -------------------------------------------------------------------------- */
    [data-shape="nemesis"],
    [data-theme="nemesis-blue"] {
      --pat-elbow-top:     var(--c-secondary);  /* Deep Cobalt top-left block */
      --pat-junc-top:      var(--c-secondary);  /* Deep Cobalt upper elbow + long arm */
      --pat-junc-bot:      var(--c-primary);    /* Cerulean Cyan lower elbow + long arm */
      --pat-elbow-bot:     var(--c-primary);    /* Cerulean bottom anchor (34867-861) */

      /* Top Divider Rule: [Tan Square Pip] [Cerulean Bar] [Royal Cobalt Bar] [Charcoal End Block] */
      --pat-div1-lead:     var(--c-accent);     /* Short Sand/Tan block after elbow */
      --pat-div1-pip:      var(--c-primary);    /* Cerulean segment */
      --pat-div1-main:     var(--c-secondary);  /* Royal Cobalt main bar */
      --pat-div1-cap:      var(--c-tertiary);   /* Squared-off Slate end block */

      /* Bottom Divider Rule: [Tan Square Pip] [Pale Ice Bar] [Cerulean Bar] [Charcoal End Block]
         (INTERNAL SYS SCAN 015: pale bar sits between the tan pip and the long cerulean run) */
      --pat-div2-lead:     var(--c-accent);     /* Short Sand/Tan block after elbow */
      --pat-div2-pip:      var(--c-ok);         /* Pale Ice segment */
      --pat-div2-main:     var(--c-primary);    /* Cerulean main bar */
      --pat-div2-cap:      var(--c-tertiary);   /* Squared-off Slate end block */

      /* Header Stat Pills */
      --pat-hdr-attr-lbl:  var(--c-secondary);
      --pat-hdr-attr-tail: var(--c-primary);
      --pat-hdr-dept-lbl:  var(--c-primary);
      --pat-hdr-dept-tail: var(--c-accent);

      /* Left Rail: ROMULAN NEUTRAL ZONE rail (10-02) blended with SYS SCAN 015 (LCARS 6) */
      --pat-rail-1:        var(--c-secondary);  /* 01 Ground: Royal Cobalt (TARGETING ARRAY) */
      --pat-rail-2:        var(--c-ok);         /* 02 Space: Pale Ice (TRAJECTORY) */
      --pat-rail-3:        var(--c-primary);    /* 03 Social: Sky Cerulean (25835-284) */
      --pat-rail-4:        var(--c-secondary);  /* 04 Science: Royal Cobalt (DELTA V) */
      --pat-rail-5:        var(--c-muted);      /* 05 Personnel: Steel Blue (SENSOR MODE) */
      --pat-rail-6:        var(--c-accent);     /* 06 Logs: Sand/Tan (78356-664) */
      --pat-rail-7:        var(--c-alert);      /* 07 Sync: Rust (AUXILIARY SYS) */
      --pat-rail-8:        var(--c-tertiary);   /* 08 Ref: Slate (36872-352) */
      --pat-rail-spacer:   var(--c-primary);    /* Sky Cerulean base block (34867-861) */

      /* Panel Brackets: Cerulean & Cobalt instead of TNG Lavender */
      --pat-panel-1-main:  var(--c-primary);
      --pat-panel-1-cap:   var(--c-accent);
      --pat-panel-2-main:  var(--c-secondary);
      --pat-panel-2-cap:   var(--c-primary);

      /* Bottom Footer Bar */
      --pat-foot-1:        var(--c-secondary);
      --pat-foot-2:        var(--c-accent);
      --pat-foot-3:        var(--c-alert);
      --pat-foot-end:      var(--c-primary);
    }

    /* --------------------------------------------------------------------------
       4. TMP / EXCELSIOR ERA PATTERN OVERRIDE
       USS Excelsior bridge consoles: electric-blue CRT frame structure, with
       phosphor-green and cyan key blocks grouped by division and lime markers.
       -------------------------------------------------------------------------- */
    [data-shape="tmp-era"],
    [data-theme="tmp-era"] {
      --pat-elbow-top:     var(--c-primary);    /* Blue CRT frame corner */
      --pat-junc-top:      var(--c-primary);
      --pat-junc-bot:      var(--c-primary);
      --pat-elbow-bot:     var(--c-primary);

      --pat-div1-lead:     var(--c-secondary);  /* Green key tab */
      --pat-div1-pip:      var(--c-accent);     /* Lime marker */
      --pat-div1-main:     var(--c-primary);    /* Blue frame rule */
      --pat-div1-cap:      var(--c-tertiary);

      --pat-div2-lead:     var(--c-tertiary);   /* Cyan key tab */
      --pat-div2-pip:      var(--c-secondary);
      --pat-div2-main:     var(--c-primary);
      --pat-div2-cap:      var(--c-secondary);

      --pat-hdr-attr-lbl:  var(--c-secondary);
      --pat-hdr-attr-tail: var(--c-muted);
      --pat-hdr-dept-lbl:  var(--c-tertiary);
      --pat-hdr-dept-tail: var(--c-primary);

      /* Grouped by functional shipboard division, like the helm key banks */
      --pat-rail-1:        var(--c-secondary);  /* Ground Combat (Green) */
      --pat-rail-2:        var(--c-secondary);  /* Space Combat (Green) */
      --pat-rail-3:        var(--c-tertiary);   /* Social (Cyan) */
      --pat-rail-4:        var(--c-tertiary);   /* Science (Cyan) */
      --pat-rail-5:        var(--c-ok);         /* Personnel (Pale Green) */
      --pat-rail-6:        var(--c-ok);         /* Logs (Pale Green) */
      --pat-rail-7:        var(--c-accent);     /* Sync (Lime) */
      --pat-rail-8:        var(--c-muted);      /* Reference (Deep Green) */
      --pat-rail-spacer:   var(--c-primary);

      --pat-panel-1-main:  var(--c-primary);    /* All CRT frames outline in blue */
      --pat-panel-1-cap:   var(--c-secondary);
      --pat-panel-2-main:  var(--c-primary);
      --pat-panel-2-cap:   var(--c-tertiary);

      --pat-foot-1:        var(--c-primary);
      --pat-foot-2:        var(--c-secondary);
      --pat-foot-3:        var(--c-accent);
      --pat-foot-end:      var(--c-tertiary);
    }

    /* --------------------------------------------------------------------------
       5. PICARD 25C (STARGAZER / TITAN-A) PATTERN OVERRIDE
       Stealth gunmetal structural chassis (--c-secondary / --c-tertiary) with
       surgical orange-red (--c-primary) and coral (--c-accent) tactical leads.
       -------------------------------------------------------------------------- */
    [data-shape="picard-v2"],
    [data-theme="picard-v2"] {
      --pat-elbow-top:     var(--c-tertiary);   /* Gunmetal corner instead of loud orange */
      --pat-junc-top:      var(--c-secondary);
      --pat-junc-bot:      var(--c-tertiary);
      --pat-elbow-bot:     var(--c-tertiary);

      --pat-div1-lead:     var(--c-primary);    /* Hot orange-red lead into gunmetal bar */
      --pat-div1-pip:      var(--c-accent);
      --pat-div1-main:     var(--c-secondary);
      --pat-div1-cap:      var(--c-primary);

      --pat-div2-lead:     var(--c-accent);
      --pat-div2-pip:      var(--c-primary);
      --pat-div2-main:     var(--c-tertiary);
      --pat-div2-cap:      var(--c-accent);

      --pat-hdr-attr-lbl:  var(--c-tertiary);
      --pat-hdr-attr-tail: var(--c-primary);
      --pat-hdr-dept-lbl:  var(--c-secondary);
      --pat-hdr-dept-tail: var(--c-accent);

      --pat-panel-1-main:  var(--c-secondary);
      --pat-panel-1-cap:   var(--c-primary);
      --pat-panel-2-main:  var(--c-tertiary);
      --pat-panel-2-cap:   var(--c-accent);

      --pat-foot-1:        var(--c-tertiary);
      --pat-foot-2:        var(--c-secondary);
      --pat-foot-3:        var(--c-primary);
      --pat-foot-end:      var(--c-accent);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ==========================================================================
       LCARS SHAPE TOKENS & PRIMITIVES
       Derived from LCARS-Concept-Art: swept elbows, bracket frames, half-pill
       caps, numeral stub rows, segmented rule bars, black gutters.
       ========================================================================== */
    :root {
      --touch: 48px;
      --gutter: 4px;
      --frame-pad: clamp(4px, 0.6vmin, 10px);
      --rail-w: clamp(136px, 12vw, 210px);
      --top-bar: clamp(72px, 8.5vh, 92px);
      --bot-bar: clamp(18px, 2.2vh, 26px);
      --elbow-r: clamp(40px, 4vw, 64px);
      --elbow-r-inner: clamp(18px, 2vw, 28px);
      --bracket-w: 14px;
      --bracket-r: 24px;
    }

    /* Half-pill end caps: one rounded end, one flat end */
    .lcars-cap-l {
      border-radius: 999px 0 0 999px !important;
    }

    .lcars-cap-r {
      border-radius: 0 999px 999px 0 !important;
    }

    .lcars-block {
      border-radius: 0 !important;
    }

    /* Segmented rule bar */
    .lcars-rule {
      display: flex;
      gap: var(--gutter);
      height: 8px;
    }

    .lcars-rule .seg {
      flex: 1;
      background: var(--c-primary);
    }

    .lcars-rule .seg.w2 {
      flex: 2;
    }

    .lcars-rule .seg.w4 {
      flex: 4;
    }

    .lcars-rule .seg.c2 {
      background: var(--c-secondary);
    }

    .lcars-rule .seg.c3 {
      background: var(--c-tertiary);
    }

    .lcars-rule .seg.c4 {
      background: var(--c-accent);
    }

    .lcars-rule .seg.c5 {
      background: var(--c-muted);
    }

    /* Numeral stub row: [stub][large number on black][label block] */
    .lcars-stub-row {
      --tone: var(--c-primary);
      display: flex;
      align-items: stretch;
      gap: var(--gutter);
      min-height: var(--touch);
    }

    .lcars-stub-row.t2 {
      --tone: var(--c-secondary);
    }

    .lcars-stub-row.t3 {
      --tone: var(--c-tertiary);
    }

    .lcars-stub-row.t4 {
      --tone: var(--c-accent);
    }

    .lcars-stub-row.t5 {
      --tone: var(--c-muted);
    }

    .lcars-stub-row.alert {
      --tone: var(--c-alert);
    }

    .lcars-stub-row .stub {
      flex: 0 0 18px;
      background: var(--tone);
      border-radius: 999px 0 0 999px;
    }

    .lcars-stub-row .num,
    .lcars-stub-row input.num {
      flex: 0 0 auto;
      min-width: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      padding: 0 8px;
      background: var(--bg);
      color: var(--tone);
      border: none;
      font-family: 'Antonio', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      text-align: right;
    }

    .lcars-stub-row input.num {
      width: 64px;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .lcars-stub-row .num input {
      width: 46px;
      height: 100%;
      background: var(--bg);
      color: var(--tone);
      border: none;
      font-family: 'Antonio', sans-serif;
      font-size: 1.9rem;
      font-weight: 700;
      text-align: right;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .lcars-stub-row input::-webkit-outer-spin-button,
    .lcars-stub-row input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .lcars-stub-row input:focus {
      outline: none;
      color: var(--text-main);
    }

    .lcars-stub-row .lbl {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 4px 10px;
      background: var(--tone);
      color: #000;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    /* Swept elbow: thick outer radius + concave inner corner */
    .lcars-elbow {
      --elbow-c: var(--c-primary);
      position: relative;
      background: var(--elbow-c);
      color: #000;
      font-weight: 700;
      display: flex;
      padding: 8px 14px;
    }

    .lcars-elbow::after {
      content: "";
      position: absolute;
      left: 100%;
      width: var(--elbow-r-inner);
      height: var(--elbow-r-inner);
      pointer-events: none;
    }

    .lcars-elbow.tl {
      border-top-left-radius: var(--tl-elbow-r, var(--elbow-r));      /* Or 12px for a subtle PADD corner or 0px for square */
      align-items: flex-end;
      justify-content: flex-end;
    }

    .lcars-elbow.tl::after {
      display: none;
    }

    .lcars-elbow.bl {
      border-bottom-left-radius: var(--elbow-r);
      align-items: flex-start;
      justify-content: flex-end;
    }

    .lcars-elbow.bl::after {
      bottom: var(--bot-bar);
      background: radial-gradient(circle at 100% 0%,
          transparent calc(var(--elbow-r-inner) - 0.5px),
          var(--elbow-c) var(--elbow-r-inner));
    }

    /* ==========================================================================
       OUTER FRAME (tablet landscape: fixed frame, scrolling workspace)
       ========================================================================== */
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Antonio', 'Oswald', 'Arial Narrow', sans-serif;
      letter-spacing: 0.04em;
      padding: var(--frame-pad);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .lcars-frame {
      display: grid;
      grid-template-columns: var(--rail-w) minmax(0, 1fr);
      grid-template-rows:
        auto auto minmax(0, 1fr) calc(var(--bot-bar) + var(--elbow-r-inner) + 10px);
      grid-template-areas:
        "elbowtop     header"
        "divider-rail divider-main"
        "rail         main"
        "elbowbot     footer";
      column-gap: 0;
      row-gap: var(--gutter);
      width: 100%;
      height: 100%;
      min-height: 0;
      max-width: none;
      margin: 0;
    }

    .frame-elbow-top {
      grid-area: elbowtop;
      --elbow-c: var(--pat-elbow-top);
      min-height: var(--top-bar);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.1;
      border: none;
      cursor: pointer;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      text-align: right;
      gap: 2px;
    }

    .frame-elbow-top .opt-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .frame-elbow-top.active {
      background:
        linear-gradient(90deg,
          transparent 0 calc(100% - 16px),
          var(--bg) calc(100% - 16px) calc(100% - 12px),
          var(--c-primary) calc(100% - 12px)),
        var(--text-main);
      padding-right: 24px;
    }

    .frame-elbow-bot {
      grid-area: elbowbot;
      --elbow-c: var(--pat-elbow-bot);
      font-size: 0.8rem;
    }

    .lcars-header {
      grid-area: header;
      display: flex;
      flex-direction: column;
      gap: var(--gutter);
      min-width: 0;
    }

    /* Wide desktop: Attrs | Depts | TN/Crit/Comp | Det/Stress | Mom/Threat */
    .lcars-header-bar {
      display: grid;
      grid-template-columns:
        minmax(0, 1.05fr)
        minmax(0, 1.05fr)
        76px
        minmax(175px, 0.9fr)
        minmax(165px, 0.82fr);
      gap: var(--gutter);
      min-height: var(--top-bar);
      min-width: 0;
    }

    .hdr-focus-ribbon {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px 6px 2px calc(var(--j-stub-ext) + var(--gutter));
      min-height: 28px;
    }

    .hdr-focus-ribbon[hidden] {
      display: none !important;
    }

    .hdr-focus-ribbon .hdr-focus-lbl {
      background: var(--c-secondary);
      color: #000;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 10px 3px 12px;
      border-radius: 999px 0 0 999px;
    }

    .hdr-focus-ribbon .focus-chip {
      margin: 0;
      min-height: 24px;
      font-size: 0.76rem;
      padding: 0 10px;
    }

    .hdr-attrs,
    .hdr-depts {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: 1fr 1fr;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--gutter);
      min-width: 0;
    }

    .hdr-attrs {
      padding-left: calc(var(--j-stub-ext) + var(--gutter));
    }

    /* =========================================================================
       LCARS CROSSBAR DIVIDER & SHAPE-DRIVEN GEOMETRY
       ========================================================================= */
    :root,
    [data-shape="tng"] {
      --tl-elbow-r: var(--elbow-r);
      --j-arm-h: 8px;
      --j-curve-r: 32px;
      --j-inner-r: 16px;
      --j-stub-ext: 18px;
      --j-top-h: 34px;
      --j-bot-h: 42px;
      --j-cap-radius: 0 999px 999px 0;
      --ld-cutout-display: none;
      --tmp-ticks-display: none;
      --pic-ticks-display: none;
      --voy-node-display: none;
      --nem-bevel-display: none;
    }

    /* LOWER DECKS GEOMETRY: Soft-rounded top block, thicker bars, spoon cutouts */
    [data-shape="lower-decks"] {
      --tl-elbow-r: 22px;
      --bracket-w: 18px;
      --bracket-r: 28px;
      --j-arm-h: 11px;
      --j-curve-r: 36px;
      --j-inner-r: 18px;
      --j-stub-ext: 18px;
      --j-top-h: 38px;
      --j-bot-h: 46px;
      --j-cap-radius: 0 999px 999px 0;
      --ld-cutout-display: block;
      --tmp-ticks-display: none;
      --pic-ticks-display: none;
      --voy-node-display: none;
      --nem-bevel-display: none;
    }

    /* Cel-shaded thin companion line under each panel header (LUNAR DEMOLITION
       paired bars: a thick amber bar riding over a thin pale-yellow rule) */
    [data-shape="lower-decks"] .lcars-panel-header {
      box-shadow: 0 6px 0 -2px var(--bg), 0 8px 0 -2px var(--c-accent);
    }

    /* TMP / EXCELSIOR ERA GEOMETRY: Rounded-rectangle CRT frames, thin blue frame
       rules with telemetry ticks, rounded-key corners */
    [data-shape="tmp-era"] {
      --elbow-r: 16px;
      --tl-elbow-r: 16px;
      --elbow-r-inner: 8px;
      --bracket-w: 3px;
      --bracket-r: 12px;
      --j-arm-h: 5px;
      --j-curve-r: 14px;
      --j-inner-r: 8px;
      --j-stub-ext: 14px;
      --j-top-h: 32px;
      --j-bot-h: 38px;
      --j-cap-radius: 3px;
      --ld-cutout-display: none;
      --tmp-ticks-display: block;
      --pic-ticks-display: none;
      --voy-node-display: none;
      --nem-bevel-display: none;
    }

    /* =========================================================================
       VOYAGER (INTREPID-CLASS) SHAPE PROFILE
       Features: Compact Tighter Elbows, Bi-Neural Gel Pack Sensor Nodes in the
       divider rules, double-stepped rail buttons, and asymmetric pill caps.
       ========================================================================= */
    [data-shape="voyager"] {
      --elbow-r: 44px;
      --tl-elbow-r: 36px;
      --elbow-r-inner: 20px;
      --bracket-w: 12px;
      --bracket-r: 18px;
      --j-arm-h: 7px;
      --j-curve-r: 26px;
      --j-inner-r: 12px;
      --j-stub-ext: 22px;
      --j-top-h: 32px;
      --j-bot-h: 38px;
      --j-cap-radius: 0 999px 999px 0;
      --ld-cutout-display: none;
      --tmp-ticks-display: none;
      --pic-ticks-display: none;
      --voy-node-display: block;
      --nem-bevel-display: none;
    }

    /* Voyager Bi-Neural Sensor Node inside the horizontal divider rules */
    .voy-node {
      display: var(--voy-node-display);
      position: absolute;
      left: 28%;
      top: 0;
      bottom: 0;
      width: 54px;
      background: linear-gradient(90deg,
        var(--bg) 0 4px,
        var(--c-accent) 4px 18px,
        var(--bg) 18px 22px,
        var(--c-tertiary) 22px 50px,
        var(--bg) 50px 54px);
      pointer-events: none;
    }

    /* Intrepid rail blocks: square blocks with a slim right-side telemetry pip.
       Inset shadows draw [4px black gap][6px pip] while keeping each slot's
       --pat-rail-N fill from the positional pattern engine. */
    [data-shape="voyager"] .lcars-rail-btn {
      border-radius: 0;
      box-shadow: inset -6px 0 0 var(--c-alert), inset -10px 0 0 var(--bg);
      padding-right: 18px;
    }
    [data-shape="voyager"] .lcars-rail-btn:nth-child(even) {
      box-shadow: inset -6px 0 0 var(--c-accent), inset -10px 0 0 var(--bg);
    }
    [data-shape="voyager"] .lcars-rail-btn:nth-child(6),
    [data-shape="voyager"] .lcars-rail-btn:nth-child(8) {
      box-shadow: inset -6px 0 0 var(--c-primary), inset -10px 0 0 var(--bg);
    }
    [data-shape="voyager"] .lcars-rail-btn.active {
      box-shadow: none;
      background:
        linear-gradient(90deg,
          var(--text-main) 0 calc(100% - 16px),
          var(--bg) calc(100% - 16px) calc(100% - 12px),
          var(--c-accent) calc(100% - 12px));
      padding-right: 24px;
    }

    /* Voyager tapered panel header & dual-ring bottom bracket */
    [data-shape="voyager"] .lcars-panel-header {
      border-radius: 18px 999px 999px 0;
    }
    [data-shape="voyager"] .lcars-panel::after {
      border-bottom-width: 8px;
      box-shadow: inset 0 -3px 0 var(--bg), inset 0 -5px 0 var(--c-secondary);
    }

    /* =========================================================================
       NEMESIS (SOVEREIGN-CLASS / 2379) SCREEN-ACCURATE SHAPE PROFILE
       Derived from Enterprise-E set graphics (INTERNAL SYS SCAN 015, LONG RANGE
       SCAN 081568, ROMULAN NEUTRAL ZONE):
       - Long-arm swept T-junction elbows meeting a short square Ochre/Tan block
       - Squared-off dark slate end-blocks on horizontal divider bars
       - Flat-edged left rail blocks with thin horizontal separator ticks
       - Bracketed scan panels + subtle deep-blue tactical grid workspace
       ========================================================================= */
    [data-shape="nemesis"] {
      --elbow-r: 28px;
      --tl-elbow-r: 0px;                        /* Flat top-left block (LCARS 54835) */
      --elbow-r-inner: 14px;
      --bracket-w: 12px;
      --bracket-r: 16px;
      --j-arm-h: 9px;                           /* Crisp 9px horizontal scan bars */
      --j-curve-r: 28px;                        /* Smooth Sovereign outer elbow curve */
      --j-inner-r: 14px;                        /* Smooth concave inner elbow curve */
      --j-stub-ext: clamp(70px, 14vw, 210px);   /* Long horizontal elbow arm (LCARS 6) */
      --j-top-h: 38px;
      --j-bot-h: 44px;
      --j-cap-radius: 0;                        /* Squared-off right end-blocks */
      --ld-cutout-display: none;
      --tmp-ticks-display: none;
      --pic-ticks-display: none;
      --voy-node-display: none;
      --nem-bevel-display: block;
    }

    /* Keep header attributes aligned with the panel edge while the divider elbow extends below */
    [data-shape="nemesis"] .hdr-attrs {
      padding-left: 18px;
    }

    /* Sovereign Crossbar Proportions:
       [Long Elbow Arm] | [Short Square Tan Block] | [Secondary Seg] | [Long Main Bar] | [Charcoal End Block] */
    [data-shape="nemesis"] .lcars-header-divider .d-seg-lead {
      flex: 0 0 28px;                           /* Short Ochre/Tan block (LCARS 6 & 8) */
    }
    [data-shape="nemesis"] .lcars-header-divider .d-seg-pip {
      flex: 0.35;
    }
    [data-shape="nemesis"] .lcars-header-divider .d-seg-main {
      flex: 1.65;
    }
    [data-shape="nemesis"] .lcars-header-divider .d-seg-cap {
      flex: 0 0 56px;
      border-radius: 0 !important;
    }

    /* Sovereign Right-End Double Block Split inside .d-seg-main (matches LCARS 6 right edge) */
    .nem-bevel {
      display: var(--nem-bevel-display);
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 42px;
      background: linear-gradient(
        90deg,
        var(--bg) 0 4px,
        var(--c-tertiary) 4px 42px
      );
      pointer-events: none;
    }

    /* Left Rail: Flat rectangular blocks with subtle dark telemetry tick on the left edge */
    [data-shape="nemesis"] .lcars-rail-btn {
      border-radius: 0;
      color: #000;
    }

    /* Royal Cobalt / Slate / Rust rail buttons use bright Ice-White text for crisp legibility */
    [data-shape="nemesis"][data-theme="nemesis-blue"] .lcars-rail-btn:nth-child(1),
    [data-shape="nemesis"][data-theme="nemesis-blue"] .lcars-rail-btn:nth-child(4),
    [data-shape="nemesis"][data-theme="nemesis-blue"] .lcars-rail-btn:nth-child(7),
    [data-shape="nemesis"][data-theme="nemesis-blue"] .lcars-rail-btn:nth-child(8) {
      color: var(--text-main);
    }

    [data-shape="nemesis"] .lcars-rail-btn.active {
      background:
        linear-gradient(90deg,
          transparent 0 calc(100% - 16px),
          var(--bg) calc(100% - 16px) calc(100% - 12px),
          var(--c-accent) calc(100% - 12px)),
        var(--text-main) !important;
      color: #000 !important;
      padding-right: 24px;
    }

    /* Sovereign Panel Headers & Scan Brackets (matches INTERNAL SYS SCAN 015 C-brackets) */
    [data-shape="nemesis"] .lcars-panel-header {
      border-radius: 16px 0 0 0;
      background: linear-gradient(90deg,
        var(--tone) 0 calc(100% - 88px),
        var(--bg) calc(100% - 88px) calc(100% - 84px),
        var(--c-accent) calc(100% - 84px) calc(100% - 56px),
        var(--bg) calc(100% - 56px) calc(100% - 52px),
        var(--c-tertiary) calc(100% - 52px));
    }

    [data-shape="nemesis"] .header-endcap {
      border-radius: 0;
    }

    /* Subtle Enterprise-E Astrometrics / Tactical Blue Grid in the main workspace (LCARS 10-00 & 10-02) */
    [data-shape="nemesis"] .main-workspace {
      background-image:
        linear-gradient(rgba(51, 88, 212, 0.11) 1px, transparent 1px),
        linear-gradient(90deg, rgba(51, 88, 212, 0.11) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    body[data-shape="nemesis"][data-alert="red"] .main-workspace {
      background-image:
        linear-gradient(rgba(184, 38, 44, 0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(184, 38, 44, 0.10) 1px, transparent 1px);
    }

    /* Sovereign scan-title treatment: panel titles read like "INTERNAL SYS SCAN 015" */
    [data-shape="nemesis"] .lcars-panel-title {
      letter-spacing: 0.04em;
      font-size: 1.18rem;
    }

    /* Footer bar ends with a squared-off Sovereign block instead of a round pill */
    [data-shape="nemesis"] .lcars-footer-bar .seg.end {
      border-radius: 0;
    }

    /* =========================================================================
       PICARD V2 (25TH CENTURY) SHAPE PROFILE
       Features: Double-track inner elbow pin-stripes, hollow/outlined gunmetal 
       controls, micro-grid workspace, and barcode telemetry end-ticks.
       ========================================================================= */
    :root {
      --pic-ticks-display: none;
    }

    [data-shape="picard-v2"] {
      --elbow-r: 36px;
      --tl-elbow-r: 28px;
      --elbow-r-inner: 14px;
      --bracket-w: 10px;
      --bracket-r: 6px;
      --j-arm-h: 5px;           /* Ultra-thin 25c horizontal divider bars */
      --j-curve-r: 22px;
      --j-inner-r: 10px;
      --j-stub-ext: 24px;
      --j-top-h: 28px;
      --j-bot-h: 34px;
      --j-cap-radius: 0;        /* Crisp micro-ticks at bar ends */
      --ld-cutout-display: none;
      --tmp-ticks-display: none;
      --pic-ticks-display: block;
      --voy-node-display: none;
      --nem-bevel-display: none;
    }

    /* Smoked glass depth & inner parallel hairline on panel brackets */
    [data-shape="picard-v2"] .lcars-panel {
      background: linear-gradient(180deg, rgba(82, 89, 110, 0.06) 0%, rgba(0, 0, 0, 0) 100%);
      box-shadow: inset 1px 0 0 rgba(210, 213, 223, 0.15);
    }

    /* Inner parallel hairline along the vertical bracket leg */
    [data-shape="picard-v2"] .lcars-panel::before {
      box-shadow: 3px 0 0 var(--bg), 5px 0 0 var(--c-tertiary);
    }

    /* Picard S2/S3 Stargazer Header & Title Blocks */
    [data-shape="picard-v2"] .lcars-panel-header,
    [data-shape="picard-v2"] .lcars-panel-header:has(> .header-endcap) {
      min-height: 38px;
      border-radius: 4px 4px 4px 0 !important;
      background: linear-gradient(90deg,
        var(--tone) 0 calc(100% - 76px),
        var(--bg) calc(100% - 76px) calc(100% - 72px),
        var(--c-primary) calc(100% - 72px) calc(100% - 64px),
        var(--bg) calc(100% - 64px) calc(100% - 60px),
        var(--tone-2) calc(100% - 60px));
    }

    [data-shape="picard-v2"] .lcars-panel-header:has(> .header-endcap) {
      background: var(--tone);
    }

    [data-shape="picard-v2"] .header-endcap {
      border-radius: 0 4px 4px 0 !important;
    }

    [data-shape="picard-v2"] .lcars-panel-header::after {
      display: none !important;
    }

    /* Left rail buttons: Gunmetal with orange-red accent rail indicator */
    [data-shape="picard-v2"] .lcars-rail-btn,
    [data-shape="picard-v2"] .lcars-rail-btn:nth-child(odd) {
      background:
        linear-gradient(90deg,
          var(--c-primary) 0 6px,
          var(--bg) 6px 10px,
          var(--c-tertiary) 10px 100%);
      color: var(--text-main);
      border-radius: 0 4px 4px 0;
    }

    [data-shape="picard-v2"] .lcars-rail-btn:nth-child(even) {
      background:
        linear-gradient(90deg,
          var(--c-accent) 0 6px,
          var(--bg) 6px 10px,
          var(--c-secondary) 10px 100%);
      color: #000;
    }

    [data-shape="picard-v2"] .lcars-rail-btn.active {
      background:
        linear-gradient(90deg,
          var(--text-main) 0 6px,
          var(--bg) 6px 10px,
          var(--c-primary) 10px calc(100% - 16px),
          var(--bg) calc(100% - 16px) calc(100% - 12px),
          var(--text-main) calc(100% - 12px));
      color: #000;
    }

    /* 25c Stepped micro-radii & pill overrides — replaces chunky 24c round caps */
    [data-shape="picard-v2"] .lcars-cap-l,
    [data-shape="picard-v2"] .stat-seg.end.minus,
    [data-shape="picard-v2"] .hdr-stat .lbl,
    [data-shape="picard-v2"] .hdr-read .cap,
    [data-shape="picard-v2"] .roll-card-title,
    [data-shape="picard-v2"] .tn-pill,
    [data-shape="picard-v2"] .editable-tag,
    [data-shape="picard-v2"] .id-field label,
    [data-shape="picard-v2"] .dice-bar .dice-btn:first-child,
    [data-shape="picard-v2"] .lcars-opt-btn,
    [data-shape="picard-v2"] .lcars-opt-btn .opt-code,
    [data-shape="picard-v2"] .lcars-shape-chip:first-child,
    [data-shape="picard-v2"] .hdr-focus-ribbon .hdr-focus-lbl,
    [data-shape="picard-v2"] .ref-table th:first-child,
    [data-shape="picard-v2"] .ref-table td:first-child {
      border-radius: 4px 0 0 4px !important;
    }

    [data-shape="picard-v2"] .lcars-cap-r,
    [data-shape="picard-v2"] .stat-seg.end.plus,
    [data-shape="picard-v2"] .hdr-stat .tail,
    [data-shape="picard-v2"] .hdr-read,
    [data-shape="picard-v2"] .roll-card-controls .pill-btn,
    [data-shape="picard-v2"] .roll-card-header .del-x,
    [data-shape="picard-v2"] .tn-badge-group > :last-child,
    [data-shape="picard-v2"] .focus-chip,
    [data-shape="picard-v2"] .id-field input,
    [data-shape="picard-v2"] .dice-bar .dice-btn:last-child,
    [data-shape="picard-v2"] .lcars-footer-bar .seg.end,
    [data-shape="picard-v2"] .lcars-opt-btn .opt-pip,
    [data-shape="picard-v2"] .lcars-shape-chip:last-child,
    [data-shape="picard-v2"] .lcars-subrail-tab {
      border-radius: 0 4px 4px 0 !important;
    }

    [data-shape="picard-v2"] .pill-btn,
    [data-shape="picard-v2"] .portrait-card,
    [data-shape="picard-v2"] .lcars-tip {
      border-radius: 4px !important;
    }

    [data-shape="picard-v2"] .crit-pill,
    [data-shape="picard-v2"] .ship-pill,
    [data-shape="picard-v2"] .lcars-stub-row .stub {
      border-radius: 0 !important;
    }

    [data-shape="picard-v2"] .hdr-stat .lbl {
      letter-spacing: 0.10em;
    }
    [data-shape="picard-v2"] .lcars-panel-title {
      letter-spacing: 0.12em;
    }

    /* Outlined / hollow gunmetal control pills (unselected state) */
    [data-shape="picard-v2"] .stat-pill:not(.selected) {
      background: var(--bg);
      box-shadow: inset 0 0 0 1px var(--c-secondary);
      border-radius: 4px;
    }
    [data-shape="picard-v2"] .stat-pill:not(.selected) .stat-seg.label {
      background: #131722;
      color: var(--text-main);
      border-right: 2px solid var(--c-primary);
      border-radius: 4px 0 0 4px !important;
    }
    [data-shape="picard-v2"] .stat-pill:not(.selected) .stat-seg.cap {
      background: var(--c-secondary);
      border-radius: 0 4px 4px 0 !important;
    }

    /* Selected stat pill lights up solid orange-red */
    [data-shape="picard-v2"] .stat-pill.selected {
      border-radius: 4px;
    }
    [data-shape="picard-v2"] .stat-pill.selected .stat-seg.label {
      background: var(--c-primary);
      color: #000;
      border-radius: 4px 0 0 4px !important;
    }
    [data-shape="picard-v2"] .stat-pill.selected .stat-seg.cap {
      background: var(--c-primary);
      border-radius: 0 4px 4px 0 !important;
    }
    [data-shape="picard-v2"] .stat-pill.selected .stat-seg.value {
      color: var(--c-primary);
    }

    /* Technical roll card title */
    [data-shape="picard-v2"] .roll-card-title {
      background: #1c202b;
      box-shadow: inset 0 0 0 1px var(--c-secondary);
      border-left: 3px solid var(--c-primary);
      color: var(--text-main);
      border-radius: 4px 0 0 4px !important;
    }

    /* Workspace subtle 25c micro-grid background */
    [data-shape="picard-v2"] .main-workspace {
      background-image: linear-gradient(rgba(109, 116, 140, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(109, 116, 140, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Barcode telemetry end-ticks */
    .pic-ticks {
      display: var(--pic-ticks-display);
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 24px;
      background: repeating-linear-gradient(
        90deg,
        var(--c-primary) 0 2px,
        var(--bg) 2px 5px,
        var(--c-accent) 5px 6px,
        var(--bg) 6px 10px
      );
      pointer-events: none;
    }

    [data-shape="picard-v2"] .code,
    [data-shape="picard-v2"] .j-code,
    [data-shape="picard-v2"] #stardate-corner,
    [data-shape="picard-v2"] .lcars-header-data {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.06em;
    }

    /* Left junction block — sits in the rail column */
    .lcars-divider-junction {
      grid-area: divider-rail;
      display: flex;
      flex-direction: column;
      gap: var(--gutter);
      position: relative;
      z-index: 2;
    }

    .junction-elbow {
      --j-color: var(--c-tertiary);
      position: relative;
      background: var(--j-color);
      color: #000;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: flex-end;
      padding: 4px 12px;
    }

    .junction-elbow.top {
      --j-color: var(--pat-junc-top);
      height: var(--j-top-h);
      border-bottom-left-radius: var(--j-curve-r);
      align-items: flex-start;
      padding-top: 5px;
    }

    .junction-elbow.top::before {
      content: "";
      position: absolute;
      left: 100%;
      bottom: 0;
      width: var(--j-stub-ext);
      height: var(--j-arm-h);
      background: var(--j-color);
    }

    .junction-elbow.top::after {
      content: "";
      position: absolute;
      left: 100%;
      bottom: var(--j-arm-h);
      width: var(--j-inner-r);
      height: var(--j-inner-r);
      background: radial-gradient(circle at 100% 0%,
          transparent calc(var(--j-inner-r) - 0.5px),
          var(--j-color) var(--j-inner-r));
      pointer-events: none;
    }

    .junction-elbow.bottom {
      --j-color: var(--pat-junc-bot);
      height: var(--j-bot-h);
      border-top-left-radius: var(--j-curve-r);
      align-items: flex-end;
      padding-bottom: 5px;
    }

    .junction-elbow.bottom::before {
      content: "";
      position: absolute;
      left: 100%;
      top: 0;
      width: var(--j-stub-ext);
      height: var(--j-arm-h);
      background: var(--j-color);
    }

    .junction-elbow.bottom::after {
      content: "";
      position: absolute;
      left: 100%;
      top: var(--j-arm-h);
      width: var(--j-inner-r);
      height: var(--j-inner-r);
      background: radial-gradient(circle at 100% 100%,
          transparent calc(var(--j-inner-r) - 0.5px),
          var(--j-color) var(--j-inner-r));
      pointer-events: none;
    }

    /* Right divider bars — sit in the main column */
    .lcars-header-divider {
      grid-area: divider-main;
      display: flex;
      flex-direction: column;
      gap: var(--gutter);
      padding-top: calc(var(--j-top-h) - var(--j-arm-h));
      padding-bottom: calc(var(--j-bot-h) - var(--j-arm-h));
      padding-left: calc(var(--j-stub-ext) + var(--gutter));
      min-width: 0;
    }

    /* Hug the crossbar: the junction elbows reach up into the Options row and down
       into the rail row (both trimmed to make room), so the divider row is only
       as tall as the two bars and the header/workspace sit one gutter away. */
    @media (min-width: 761px) {
      .frame-elbow-top {
        min-height: calc(var(--top-bar) - (var(--j-top-h) - var(--j-arm-h)));
        margin-bottom: calc(var(--j-top-h) - var(--j-arm-h));
      }

      .lcars-divider-junction {
        margin-top: calc(-1 * (var(--j-top-h) - var(--j-arm-h)));
        margin-bottom: calc(-1 * (var(--j-bot-h) - var(--j-arm-h)));
      }

      .lcars-header-divider {
        padding-top: 0;
        padding-bottom: 0;
      }

      .lcars-header-bar {
        flex: 1 1 auto;
      }

      .lcars-sidebar {
        margin-top: calc(var(--j-bot-h) - var(--j-arm-h));
      }
    }

    .lcars-header-divider .rule {
      position: relative;
      display: flex;
      gap: var(--gutter);
      height: var(--j-arm-h);
      min-height: var(--j-arm-h);
    }

    .lcars-header-divider .rule .d-seg {
      position: relative;
      min-width: 0;
      overflow: hidden;
    }

    .lcars-header-divider .d-seg-lead { flex: 0.45; }
    .lcars-header-divider .d-seg-pip  { flex: 0.12; }
    .lcars-header-divider .d-seg-main { flex: 1.40; }
    .lcars-header-divider .d-seg-cap  {
      flex: 0.18;
      border-radius: var(--j-cap-radius);
    }

    .lcars-header-divider .top-rule .d-seg-lead { background: var(--pat-div1-lead); }
    .lcars-header-divider .top-rule .d-seg-pip  { background: var(--pat-div1-pip); }
    .lcars-header-divider .top-rule .d-seg-main { background: var(--pat-div1-main); }
    .lcars-header-divider .top-rule .d-seg-cap  { background: var(--pat-div1-cap); }

    .lcars-header-divider .bot-rule .d-seg-lead { background: var(--pat-div2-lead); }
    .lcars-header-divider .bot-rule .d-seg-pip  { background: var(--pat-div2-pip); }
    .lcars-header-divider .bot-rule .d-seg-main { background: var(--pat-div2-main); }
    .lcars-header-divider .bot-rule .d-seg-cap  { background: var(--pat-div2-cap); }

    /* Dormant Block 1: Lower Decks "Spoon / Keyhole" Notch Cutouts */
    .ld-cutout {
      display: var(--ld-cutout-display);
      position: absolute;
      left: 18%;
      right: 0;
      height: 55%;
      background: var(--bg, #000);
      pointer-events: none;
    }
    .top-rule .ld-cutout { bottom: 0; }
    .bot-rule .ld-cutout { top: 0; }

    .ld-cutout::before {
      content: "";
      position: absolute;
      left: -8px;
      width: 12px;
      height: 8px;
      background: var(--bg, #000);
      border-radius: 999px;
    }
    .top-rule .ld-cutout::before { bottom: 0; }
    .bot-rule .ld-cutout::before { top: 0; }

    /* Dormant Block 2: TMP Era Segmented Telemetry Ticks */
    .tmp-ticks {
      display: var(--tmp-ticks-display);
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0 14px,
        var(--bg) 14px 18px
      );
      pointer-events: none;
    }

    /* TMP Era Broader Component Shape Overrides (Excelsior rounded console keys) */
    [data-shape="tmp-era"] .lcars-cap-l,
    [data-shape="tmp-era"] .lcars-cap-r,
    [data-shape="tmp-era"] .pill-btn,
    [data-shape="tmp-era"] .stat-seg.end.minus,
    [data-shape="tmp-era"] .stat-seg.end.plus,
    [data-shape="tmp-era"] .hdr-stat .lbl,
    [data-shape="tmp-era"] .hdr-stat .tail,
    [data-shape="tmp-era"] .hdr-read,
    [data-shape="tmp-era"] .hdr-read .cap,
    [data-shape="tmp-era"] .roll-card-title,
    [data-shape="tmp-era"] .tn-pill,
    [data-shape="tmp-era"] .editable-tag,
    [data-shape="tmp-era"] .id-field label,
    [data-shape="tmp-era"] .lcars-panel-header,
    [data-shape="tmp-era"] .header-endcap,
    [data-shape="tmp-era"] .dice-bar .dice-btn:first-child,
    [data-shape="tmp-era"] .dice-bar .dice-btn:last-child,
    [data-shape="tmp-era"] .lcars-footer-bar .seg.end,
    [data-shape="tmp-era"] .lcars-stub-row .stub,
    [data-shape="tmp-era"] .lcars-opt-btn,
    [data-shape="tmp-era"] .lcars-shape-chip,
    [data-shape="tmp-era"] .lcars-rail-btn,
    [data-shape="tmp-era"] .lcars-rail-spacer {
      border-radius: 6px !important;
    }

    [data-shape="tmp-era"] .lcars-panel-header::after {
      display: none;
    }

    [data-shape="tmp-era"] .code,
    [data-shape="tmp-era"] .j-code,
    [data-shape="tmp-era"] #stardate-corner,
    [data-shape="tmp-era"] .lcars-header-data {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.04em;
    }

    /* Excelsior CRT frames: panels become thin blue rounded-rectangle outlines
       (no LCARS C-bracket) with an outlined title strip, as on the bridge
       "SUBSYSTEM STATUS" monitors and helm panels. */
    [data-shape="tmp-era"] .lcars-panel {
      border: 2px solid var(--tone);
      border-radius: 12px;
      padding: 0 12px 14px;
      box-shadow: inset 0 0 22px color-mix(in srgb, var(--tone) 14%, transparent);
    }

    [data-shape="tmp-era"] .lcars-panel::before,
    [data-shape="tmp-era"] .lcars-panel::after {
      display: none;
    }

    [data-shape="tmp-era"] .lcars-panel-header,
    [data-shape="tmp-era"] .lcars-panel-header:has(> .header-endcap) {
      margin: 0 -12px 14px;
      padding: 0 0 0 14px;
      min-height: 42px;
      background: transparent;
      border-bottom: 2px solid var(--tone);
      border-radius: 10px 10px 0 0 !important;
    }

    /* Rail filler reads as an empty outlined CRT bay rather than a solid slab */
    [data-shape="tmp-era"] .lcars-rail-spacer {
      background: transparent;
      border: 2px solid var(--pat-rail-spacer);
      color: var(--pat-rail-spacer);
    }

    [data-shape="tmp-era"] .lcars-panel-title {
      color: var(--c-secondary);
      font-family: 'Michroma', 'Antonio', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      padding-right: 12px;
    }

    [data-shape="tmp-era"] .header-endcap {
      align-self: center;
      min-height: 30px;
      margin: 0 8px 0 4px;
      box-shadow: none;
    }

    /* Faint CRT scanlines across the workspace */
    [data-shape="tmp-era"] .main-workspace {
      background-image: repeating-linear-gradient(0deg,
        rgba(47, 109, 255, 0.05) 0 1px,
        transparent 1px 3px);
    }

    [data-shape="tmp-era"] .frame-elbow-top .opt-title,
    [data-shape="tmp-era"] .lcars-rail-btn {
      letter-spacing: 0.08em;
    }

    .hdr-stat {
      display: flex;
      align-items: stretch;
      gap: 0;
      min-width: 0;
      height: 100%;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      color: #000;
    }

    .hdr-stat .lbl {
      flex: 1.15 1 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
      padding: 0 4px 0 8px;
      background: var(--pat-hdr-attr-lbl);
      border-radius: 999px 0 0 999px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hdr-stat .num {
      flex: 0 0 21px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--c-accent);
      font-family: 'Antonio', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
    }

    .hdr-stat .nub {
      flex: 0 0 6px;
      background: var(--pat-hdr-attr-lbl);
      border-radius: 0;
    }

    .hdr-stat .gap {
      flex: 0 0 3px;
      background: var(--bg);
    }

    .hdr-stat .tail {
      flex: 0 0 12px;
      background: var(--pat-hdr-attr-tail);
      border-radius: 0 999px 999px 0;
    }

    .hdr-stat.dept .lbl,
    .hdr-stat.dept .nub {
      background: var(--pat-hdr-dept-lbl);
    }

    .hdr-stat.dept .tail {
      background: var(--pat-hdr-dept-tail);
    }

    .hdr-stat.selected .lbl {
      background: var(--text-main);
    }

    .hdr-stat.has-mod .num {
      color: var(--c-muted);
    }

    .hdr-pools {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: var(--gutter);
      min-width: 0;
    }

    .hdr-pools .pool-box {
      height: 100%;
      min-height: 0;
    }

    .hdr-pools .stat-seg.end {
      flex-basis: 28px;
      width: 28px;
      font-size: 1rem;
    }

    .hdr-pools .stat-seg.label {
      font-size: 0.66rem;
      padding: 0 4px;
    }

    .hdr-pools .stat-seg.value,
    .hdr-pools input.stat-seg.value {
      flex-basis: 32px;
      width: 32px;
      font-size: 1.35rem;
    }

    .hdr-pools .stat-seg.value-pair input.stat-seg.value {
      flex-basis: 26px;
      width: 26px;
      font-size: 1.2rem;
    }

    .hdr-tn {
      display: grid;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 2px;
      min-width: 0;
    }

    .hdr-read {
      display: flex;
      align-items: stretch;
      min-width: 0;
      background: var(--bg);
      border-radius: 0 999px 999px 0;
      overflow: hidden;
    }

    .hdr-read .cap {
      flex: 0 0 12px;
      background: var(--c-primary);
      border-radius: 999px 0 0 999px;
    }

    .hdr-read .num {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
      padding: 0 4px;
      color: var(--c-accent);
      font-family: 'Antonio', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1;
    }

    .hdr-read .lbl {
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 6px;
      background: var(--c-primary);
      color: #000;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hdr-read.crit .cap,
    .hdr-read.crit .lbl {
      background: var(--c-secondary);
    }

    .hdr-read.crit .num {
      color: var(--c-secondary);
    }

    .hdr-read.comp .cap,
    .hdr-read.comp .lbl {
      background: var(--c-alert);
    }

    .hdr-read.comp .lbl {
      color: #fff;
    }

    .hdr-read.comp .num {
      color: var(--c-alert);
    }

    .hdr-title {
      flex: 1 1 auto !important;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 16px;
      background: var(--c-primary);
      color: #000;
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hdr-seg {
      width: 36px;
      background: var(--c-muted);
    }

    .lcars-header-bar select.lcars-select {
      width: auto;
      height: 100%;
      min-height: 0;
      padding: 0 34px 0 14px;
      background-color: var(--c-secondary);
      color: #000;
      font-weight: 700;
      text-transform: uppercase;
      border: none;
    }

    .lcars-header-bar .pill-btn {
      height: 100%;
      min-height: 0;
      padding: 0 22px 0 16px;
      background: var(--c-accent);
    }

    .lcars-header-data {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding: 0 4px 0 calc(var(--elbow-r-inner) + 10px);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      overflow: hidden;
      white-space: nowrap;
    }

    .lcars-header-data .lcars-rule {
      flex: 1;
      min-width: 40px;
      height: 6px;
    }

    .lcars-footer .lcars-select {
      width: auto;
      flex: 0 0 auto;
      height: 28px;
      min-height: 28px;
      font-size: 0.75rem;
    }

    .data-c1 {
      color: var(--c-primary);
    }

    .data-c2 {
      color: var(--c-secondary);
    }

    .data-c3 {
      color: var(--c-tertiary);
    }

    .data-c4 {
      color: var(--c-accent);
    }

    .lcars-footer {
      grid-area: footer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-width: 0;
    }

    .lcars-footer .lcars-header-data {
      flex: 1;
    }

    .lcars-footer-bar {
      display: flex;
      gap: var(--gutter);
      height: var(--bot-bar);
    }

    .lcars-footer-bar .seg {
      flex: 1;
      background: var(--pat-foot-1);
    }

    .lcars-footer-bar .seg.w3 {
      flex: 3;
    }

    .lcars-footer-bar .seg.c1 {
      background: var(--pat-foot-end);
    }

    .lcars-footer-bar .seg.c2 {
      background: var(--pat-foot-2);
    }

    .lcars-footer-bar .seg.c4 {
      background: var(--pat-foot-3);
    }

    .lcars-footer-bar .seg.end {
      border-radius: 0 999px 999px 0;
      flex: 0 0 88px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 14px 0 8px;
    }

    /* Left rail: square blocks, code numbers bottom-right, black gutters */
    .lcars-sidebar {
      grid-area: rail;
      display: flex;
      flex-direction: column;
      gap: var(--gutter);
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }

    .lcars-sidebar::-webkit-scrollbar {
      display: none;
    }

    .lcars-rail-btn {
      flex: 0 0 auto;
      background: var(--c-secondary);
      color: #000;
      border: none;
      min-height: clamp(46px, 6.2vh, 68px);
      padding: 6px 12px;
      text-align: right;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      line-height: 1.1;
      cursor: pointer;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
    }

    .lcars-rail-btn span.code {
      font-size: 0.7rem;
      opacity: 0.75;
    }

    .lcars-rail-btn:nth-child(1) { background: var(--pat-rail-1); }
    .lcars-rail-btn:nth-child(2) { background: var(--pat-rail-2); }
    .lcars-rail-btn:nth-child(3) { background: var(--pat-rail-3); }
    .lcars-rail-btn:nth-child(4) { background: var(--pat-rail-4); }
    .lcars-rail-btn:nth-child(5) { background: var(--pat-rail-5); }
    .lcars-rail-btn:nth-child(6) { background: var(--pat-rail-6); }
    .lcars-rail-btn:nth-child(7) { background: var(--pat-rail-7); }
    .lcars-rail-btn:nth-child(8) { background: var(--pat-rail-8); }

    /* Active scene: bright block plus a notch stub on the content edge */
    .lcars-rail-btn.active {
      background:
        linear-gradient(90deg,
          transparent 0 calc(100% - 16px),
          var(--bg) calc(100% - 16px) calc(100% - 12px),
          var(--c-primary) calc(100% - 12px)),
        var(--text-main);
      padding-right: 24px;
    }

    .lcars-rail-spacer {
      flex: 1 1 24px;
      min-height: 24px;
      background: var(--pat-rail-spacer);
      padding: 0 12px 6px;
      color: #000;
      font-weight: 700;
      font-size: 0.75rem;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
    }

    .main-workspace {
      grid-area: main;
      container-type: inline-size;
      container-name: workspace;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--c-secondary) var(--bg);
      padding: 6px 8px 16px 16px;
    }

    /* Narrow / portrait fallback: frame flows, workspace scrolls with page */
    @media (max-width: 760px) {
      body {
        height: auto;
        overflow: auto;
      }

      .lcars-frame {
        height: auto;
        min-height: 0;
        width: 100%;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto auto auto auto;
        grid-template-areas:
          "elbowtop"
          "header"
          "divider-main"
          "rail"
          "main"
          "footer";
      }

      .lcars-divider-junction,
      .frame-elbow-bot {
        display: none;
      }

      .frame-elbow-top {
        min-height: 44px;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .lcars-header-bar {
        height: auto;
        min-height: var(--top-bar);
        grid-template-columns: 1fr;
      }

      .hdr-attrs,
      .hdr-depts {
        min-height: 72px;
      }

      .hdr-tn {
        min-height: 72px;
      }

      .lcars-sidebar {
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .lcars-rail-btn {
        min-width: 120px;
      }

      .lcars-rail-spacer {
        display: none;
      }

      .main-workspace {
        overflow: visible;
        padding: 10px 0;
      }
    }

    /* Compact 4:3 and 3:2 landscape tablets use a two-deck header. */
    @media (min-width: 761px) and (max-width: 1180px),
           (min-width: 761px) and (max-aspect-ratio: 4/3) {
      .lcars-header-bar {
        height: auto;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 78px;
        grid-template-rows: var(--top-bar) 108px;
      }

      .lcars-header-bar > .hdr-pools:nth-of-type(4) {
        grid-column: 1 / 2;
        grid-row: 2;
        padding-left: calc(var(--j-stub-ext) + var(--gutter));
      }

      .lcars-header-bar > .hdr-pools:nth-of-type(5) {
        grid-column: 2 / 4;
        grid-row: 2;
      }
    }

    /* ==========================================================================
       PANEL BRACKET FRAMES
       Header bar = top arm with rounded outer corner; ::before = vertical leg;
       ::after = bottom elbow drawn with borders (outer + inner radius).
       ========================================================================== */
    .lcars-panel {
      --tone: var(--c-primary);
      --tone-2: var(--c-secondary);
      position: relative;
      background: var(--bg);
      border: none;
      border-radius: 0;
      padding: 0 0 22px calc(var(--bracket-w) + 12px);
    }

    .lcars-panel::before {
      content: "";
      position: absolute;
      left: 0;
      top: 20px;
      bottom: 39px;
      width: var(--bracket-w);
      background: var(--tone);
    }

    .lcars-panel::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: min(45%, 320px);
      height: 40px;
      border-left: var(--bracket-w) solid var(--tone);
      border-bottom: 6px solid var(--tone);
      border-bottom-left-radius: var(--bracket-r);
      pointer-events: none;
    }

    /* Panels without a leading header get a rounded top arm instead */
    .lcars-panel:not(:has(> .lcars-panel-header:first-child))::before {
      top: 0;
      border-top-left-radius: calc(var(--bracket-w) / 2);
    }

    .lcars-panel[data-tone="2"],
    #scene-container>.lcars-panel {
      --tone: var(--pat-panel-1-main);
      --tone-2: var(--pat-panel-1-cap);
    }

    .lcars-panel[data-tone="3"],
    .scene-layout>.lcars-panel:nth-child(2),
    .scene-layout>div:nth-child(2)>.lcars-panel {
      --tone: var(--pat-panel-2-main);
      --tone-2: var(--pat-panel-2-cap);
    }

    .lcars-panel[data-tone="4"] {
      --tone: var(--c-accent);
      --tone-2: var(--c-tertiary);
    }

    .lcars-panel-header {
      position: relative;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-height: var(--touch);
      margin: 0 0 14px calc(-1 * (var(--bracket-w) + 12px));
      padding: 2px 78px 2px 30px;
      background: linear-gradient(90deg,
          var(--tone) 0 calc(100% - 64px),
          var(--bg) calc(100% - 64px) calc(100% - 60px),
          var(--tone-2) calc(100% - 60px));
      border: none;
      border-radius: var(--bracket-r) 24px 24px 0;
    }

    /* Concave inner corner where the header arm meets the bracket leg */
    .lcars-panel-header::after {
      content: "";
      position: absolute;
      left: var(--bracket-w);
      top: 100%;
      width: 12px;
      height: 12px;
      background: radial-gradient(circle at 100% 100%,
          transparent 11.5px, var(--tone) 12px);
      pointer-events: none;
    }

    .lcars-panel-title {
      order: 99;
      margin-left: auto;
      text-align: right;
      font-size: 1.1rem;
      font-weight: 700;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Action lives in the header's end half-pill instead of a separate button */
    .lcars-panel-header:has(> .header-endcap) {
      padding: 0 0 0 30px;
      background: var(--tone);
    }

    .lcars-panel-header:has(> .header-endcap) .lcars-panel-title {
      padding-right: 8px;
    }

    .header-endcap {
      order: 100;
      flex: 0 0 auto;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 84px;
      min-height: var(--touch);
      margin-left: 4px;
      padding: 0 16px 0 12px;
      border: none;
      border-radius: 0 24px 24px 0;
      background: var(--tone-2);
      color: #000;
      box-shadow: -4px 0 0 var(--bg);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .lcars-panel-header .pill-btn {
      min-height: 44px;
    }

    .lcars-panel-header .pill-btn.ghost {
      background: var(--bg);
      color: var(--tone);
    }

    .lcars-panel-header .pill-btn:not(.ghost):not(.secondary):not(.tertiary):not(.accent) {
      background: var(--text-main);
      color: #000;
    }

    /* ==========================================================================
       BUTTONS, INPUTS, EDITING CUES
       ========================================================================== */
    .pill-btn {
      background: var(--c-primary);
      color: #000;
      border: none;
      border-radius: 999px;
      min-height: 44px;
      min-width: 44px;
      padding: 6px 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .pill-btn.secondary {
      background: var(--c-secondary);
    }

    .pill-btn.tertiary {
      background: var(--c-tertiary);
    }

    .pill-btn.accent {
      background: var(--c-accent);
    }

    .pill-btn.alert {
      background: var(--c-alert);
      color: #fff;
    }

    .pill-btn.ok {
      background: var(--c-ok);
    }

    .pill-btn.ghost {
      background: var(--bg);
      color: var(--c-primary);
      border: none;
    }

    /* Inline editing: no underline; the field lights up only while editing */
    [contenteditable="true"] {
      border: none;
      padding: 2px 4px;
      border-radius: 0;
      outline: none;
      cursor: text;
    }

    [contenteditable="true"]:focus {
      background: var(--c-primary);
      color: #000;
    }

    /* Suggestions for editable fields backed by the STA reference dictionary. */
    .dictionary-autocomplete {
      position: fixed;
      z-index: 1000;
      display: none;
      max-height: 13rem;
      overflow-y: auto;
      min-width: 13rem;
      background: var(--bg);
      border: 2px solid var(--c-secondary);
      box-shadow: 4px 4px 0 var(--c-primary);
    }

    .dictionary-autocomplete.open {
      display: block;
    }

    .dictionary-autocomplete-option {
      display: block;
      width: 100%;
      border: 0;
      border-bottom: 1px solid #303030;
      padding: 6px 9px;
      background: var(--bg);
      color: var(--text-main);
      font: inherit;
      font-size: 0.84rem;
      text-align: left;
      cursor: pointer;
    }

    .dictionary-autocomplete-option:hover,
    .dictionary-autocomplete-option.active {
      background: var(--c-secondary);
      color: #000;
    }

    .settings-grid,
    .reference-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .theme-card,
    .reference-entry {
      background: var(--bg);
      border-left: 8px solid var(--c-secondary);
      padding: 10px 12px;
    }

    .theme-card.active {
      border-left-color: var(--c-primary);
    }

    /* LCARS Tactile Theme Selector Bank & Shape Profile Bar */
    .lcars-theme-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 6px;
      margin-bottom: 14px;
    }

    .lcars-opt-btn {
      display: flex;
      align-items: stretch;
      height: 44px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      gap: var(--gutter);
      text-align: right;
    }

    .lcars-opt-btn .opt-code {
      flex: 0 0 52px;
      background: var(--c-secondary);
      color: #000;
      border-radius: 999px 0 0 999px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .lcars-opt-btn .opt-label {
      flex: 1;
      background: var(--c-tertiary);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 12px;
      font-size: 0.88rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lcars-opt-btn .opt-pip {
      flex: 0 0 14px;
      background: var(--c-accent);
      border-radius: 0 999px 999px 0;
    }

    .lcars-opt-btn.active .opt-code {
      background: var(--c-primary);
    }

    .lcars-opt-btn.active .opt-label {
      background: var(--text-main);
    }

    .lcars-shape-bar {
      display: flex;
      gap: var(--gutter);
      margin-top: 8px;
    }

    .lcars-shape-chip {
      flex: 1;
      min-height: 34px;
      border: none;
      background: var(--c-tertiary);
      color: #000;
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      padding: 0 8px;
    }

    .lcars-shape-chip:first-child {
      border-radius: 999px 0 0 999px;
      padding-left: 12px;
    }

    .lcars-shape-chip:last-child {
      border-radius: 0 999px 999px 0;
      padding-right: 12px;
    }

    .lcars-shape-chip.active {
      background: var(--c-primary);
      box-shadow: inset 0 0 0 2px var(--text-main);
    }

    .theme-colors {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 10px;
    }

    .theme-color-label {
      display: grid;
      gap: 3px;
      color: var(--text-dim);
      font-size: 0.68rem;
      text-transform: uppercase;
    }

    .theme-color-label input[type="color"] {
      width: 100%;
      height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .reference-toolbar {
      display: grid;
      grid-template-columns: minmax(180px, .65fr) minmax(220px, 1.35fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .reference-entry h3 {
      margin: 0 0 4px;
      color: var(--c-primary);
      font-size: 1rem;
    }

    .reference-meta {
      color: var(--c-secondary);
      font-size: 0.72rem;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    @media (max-width: 600px) {
      .reference-toolbar {
        grid-template-columns: 1fr;
      }
    }

    input.looseleaf-num {
      background: var(--bg);
      color: var(--c-accent);
