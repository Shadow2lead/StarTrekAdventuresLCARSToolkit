    function escapeHtml(text) {
      return String(text == null ? "" : text).replace(/[&<>'"]/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[char]);
    }

    function referenceCatalogs() {
      return [
        ["talents", "Talents"], ["species", "Species"], ["equipment", "Equipment"],
        ["personal_weapons", "Personal Weapons"], ["weapon_qualities", "Weapon Qualities"],
        ["environments", "Environments"], ["upbringings", "Upbringings"], ["careers", "Careers"],
        ["career_events", "Career Events"], ["ranks", "Ranks"], ["roles", "Roles"],
        ["spaceframes", "Spaceframes"], ["mission_profiles", "Mission Profiles"],
        ["service_records", "Service Records"], ["starship_weapons", "Starship Weapons"],
        ["rules_reference", "Rules Reference"]
      ];
    }

    function referenceEntries(catalogName) {
      const catalog = staDict()[catalogName] || {};
      if (catalogName === "weapon_qualities" && Object.keys(catalog).length === 0) {
        return WEAPON_QUALITY_REFERENCE;
      }
      return Object.entries(catalog).map(([key, entry]) => ({
        name: (entry && entry.name) || key,
        description: (entry && (entry.description || entry.trait_description)) || "No description is available for this entry.",
        meta: (entry && (entry.category || entry.trait || entry.scope || entry.type || entry.special_rule || "")) || "",
        pageReference: (entry && entry.page_reference) || "Not in this rulebook"
      })).sort((a, b) => a.name.localeCompare(b.name));
    }

    function referenceEntryHtml(entry) {
      const searchText = normalizeDictionaryText(`${entry.name} ${entry.description} ${entry.meta || ""} ${entry.pageReference || ""}`);
      return `<article class="reference-entry" data-reference-entry="${escapeHtml(searchText)}">
      <h3>${escapeHtml(entry.name)}</h3>
      ${entry.meta ? `<div class="reference-meta">${escapeHtml(entry.meta)}</div>` : ""}
      <div>${escapeHtml(entry.description)}</div>
      ${entry.pageReference ? `<div class="reference-meta">STA 2e Core Rulebook: ${escapeHtml(entry.pageReference)}</div>` : ""}
    </article>`;
    }

    function setReferenceCatalog(catalogName) {
      ensureAppSettings();
      state.settings.referenceCatalog = catalogName;
      state.settings.referenceSearch = "";
      saveLocalState();
      renderScene();
    }

    function filterReferenceEntries(query) {
      ensureAppSettings();
      state.settings.referenceSearch = query;
      const normalizedQuery = normalizeDictionaryText(query);
      const allEntries = referenceEntries(state.settings.referenceCatalog);
      const matchingEntries = allEntries.filter((entry) =>
        normalizeDictionaryText(`${entry.name} ${entry.description} ${entry.meta || ""} ${entry.pageReference || ""}`).includes(normalizedQuery)
      );
      const displayedEntries = normalizedQuery ? matchingEntries : matchingEntries.slice(0, 100);
      const grid = document.querySelector(".reference-grid");
      if (grid) {
        grid.innerHTML = displayedEntries.map(referenceEntryHtml).join("") || `<div class="reference-entry">No entries match this search.</div>`;
      }
      const status = document.getElementById("reference-result-count");
      if (status) {
        status.textContent = !normalizedQuery && allEntries.length > displayedEntries.length
          ? `Showing the first ${displayedEntries.length} of ${allEntries.length}; search to narrow the list.`
          : `${displayedEntries.length} matching entries`;
      }
      saveLocalState();
    }

    function renderReferencePage() {
      ensureAppSettings();
      const catalogName = state.settings.referenceCatalog;
      const query = state.settings.referenceSearch;
      const allEntries = referenceEntries(catalogName);
      const normalizedQuery = normalizeDictionaryText(query);
      const matchingEntries = allEntries.filter((entry) => normalizeDictionaryText(`${entry.name} ${entry.description} ${entry.meta || ""} ${entry.pageReference || ""}`).includes(normalizedQuery));
      const displayedEntries = normalizedQuery ? matchingEntries : matchingEntries.slice(0, 100);
      const catalogOptions = referenceCatalogs().map(([value, label]) =>
        `<option value="${value}" ${value === catalogName ? "selected" : ""}>${label}</option>`
      ).join("");
      const entriesHtml = displayedEntries.map(referenceEntryHtml).join("") || `<div class="reference-entry">No entries match this search.</div>`;
      const initialCount = displayedEntries.length;
      const browseNote = !normalizedQuery && allEntries.length > displayedEntries.length
        ? `Showing the first ${displayedEntries.length} of ${allEntries.length}; search to narrow the list.`
        : `${initialCount} matching entries`;

      return `
    <div class="lcars-panel">
      <div class="lcars-panel-header">
        <button type="button" class="pill-btn ghost" onclick="exportSortedDictionaryFile()" data-tip="Download a sorted sta-dictionary.js including any custom entries.">Export sta-dictionary.js</button>
        <span class="lcars-panel-title">Reference Library</span>
        <button type="button" class="header-endcap" onclick="promptNewReferenceEntry()" data-tip="Add a custom entry to this category.">Add</button>
      </div>
      <div class="reference-toolbar">
        <select class="lcars-select" onchange="setReferenceCatalog(this.value)">${catalogOptions}</select>
        <input class="lcars-input" value="${escapeHtml(query)}" oninput="filterReferenceEntries(this.value)" placeholder="Search this reference category" />
      </div>
      <div class="reference-meta" id="reference-result-count">${browseNote}</div>
      <div class="reference-grid">${entriesHtml}</div>
    </div>
  `;
    }

    function promptNewReferenceEntry() {
      ensureAppSettings();
      const cat = state.settings.referenceCatalog || "talents";
      const name = prompt(`New ${cat} entry name:`);
      if (!name || !name.trim()) return;
      const desc = prompt(`Description for "${name.trim()}":`) || "";
      const category = prompt(`Category / Tag (optional, e.g., Department:Science, Starship, or Custom):`, "Custom") || "Custom";

      saveCustomDictionaryEntry(state, cat, name.trim(), {
        name: name.trim(),
        description: desc.trim(),
        category: category.trim()
      });
      renderScene();
    }

    function exportSortedDictionaryFile() {
      const sortedDict = {};
      Object.keys(window.STA_DICTIONARY).forEach(category => {
        const entries = window.STA_DICTIONARY[category] || {};
        sortedDict[category] = {};
        Object.keys(entries)
          .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }))
          .forEach(key => {
            sortedDict[category][key] = entries[key];
          });
      });

      const jsContent = `window.STA_DICTIONARY = ${JSON.stringify(sortedDict, null, 2)};\n`;
      const blob = new Blob([jsContent], { type: "application/javascript" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "sta-dictionary.js";
      a.click();
      URL.revokeObjectURL(url);
    }

    /* ============================================================================
       5. INTERACTIVE LOOSELEAF MUTATION HELPERS
       ============================================================================ */
    function ensureAppSettings() {
      if (!state.settings || typeof state.settings !== "object") state.settings = defaultSettings();
      if (!Array.isArray(state.settings.customThemes)) state.settings.customThemes = defaultSettings().customThemes;
      DEFAULT_CUSTOM_THEMES.forEach((fallbackTheme, index) => {
        const current = state.settings.customThemes[index] || {};
        const validShape = SHAPE_PROFILES.some((profile) => profile.id === current.shape)
          ? current.shape
          : fallbackTheme.shape;
        state.settings.customThemes[index] = {
          id: fallbackTheme.id,
          code: fallbackTheme.code,
          name: current.name || fallbackTheme.name,
          shape: validShape,
          colors: { ...fallbackTheme.colors, ...(current.colors || {}) }
        };
      });
      state.settings.customThemes = state.settings.customThemes.slice(0, DEFAULT_CUSTOM_THEMES.length);
      if (!state.settings.activeTheme) state.settings.activeTheme = "classic-tng";
      if (!state.settings.referenceCatalog) state.settings.referenceCatalog = "talents";
      if (typeof state.settings.referenceSearch !== "string") state.settings.referenceSearch = "";
      if (typeof state.settings.showHeaderFocuses !== "boolean") state.settings.showHeaderFocuses = false;
      if (typeof state.settings.redAlert !== "boolean") state.settings.redAlert = false;
      if (state.settings.activeTheme === "red-alert") {
        state.settings.activeTheme = "classic-tng";
        state.settings.redAlert = true;
      }
      if (state.character && typeof state.character.portrait !== "string") state.character.portrait = "";
      ensureStarship2e();
    }

    function customThemeById(themeId) {
      ensureAppSettings();
      return state.settings.customThemes.find((theme) => theme.id === themeId) || null;
    }

    function syncThemeControls() {
      ensureAppSettings();
      const readout = document.getElementById("footer-theme-readout");
      if (!readout) return;
      const builtIn = BUILTIN_THEME_CATALOG.find((theme) => theme.id === state.settings.activeTheme);
      const custom = customThemeById(state.settings.activeTheme);
      const baseName = ((builtIn && builtIn.name) || (custom && custom.name) || "LCARS").toUpperCase();
      readout.textContent = state.settings.redAlert ? `${baseName} • RED ALERT` : baseName;
    }

    function applyTheme(themeName) {
      ensureAppSettings();
      const customTheme = customThemeById(themeName);
      const builtIn = BUILTIN_THEME_CATALOG.find((theme) => theme.id === themeName);
      const resolvedThemeName = customTheme ? customTheme.id : (builtIn ? builtIn.id : "classic-tng");

      document.body.setAttribute("data-theme", customTheme ? "classic-tng" : resolvedThemeName);
      const shapeId = customTheme
        ? (customTheme.shape || "tng")
        : (builtIn ? builtIn.shape : "tng");
      document.body.setAttribute("data-shape", shapeId);

      THEME_COLOR_FIELDS.forEach((field) => document.body.style.removeProperty(`--${field}`));
      if (customTheme) {
        Object.entries(customTheme.colors).forEach(([field, color]) => document.body.style.setProperty(`--${field}`, color));
      }
      state.settings.activeTheme = resolvedThemeName;
      if (state.settings.redAlert) {
        document.body.setAttribute("data-alert", "red");
      } else {
        document.body.removeAttribute("data-alert");
      }
      syncThemeControls();
    }

    function setTheme(themeName) {
      applyTheme(themeName);
      saveLocalState();
    }

    function toggleRedAlert(forceState) {
      ensureAppSettings();
      state.settings.redAlert = typeof forceState === "boolean" ? forceState : !state.settings.redAlert;
      applyTheme(state.settings.activeTheme);
      saveLocalState();
      if (state.activeScene === "options") renderScene();
    }

    function updateCustomThemeName(themeId, name) {
      const theme = customThemeById(themeId);
      if (!theme) return;
      theme.name = name.trim() || "Custom Theme";
      syncThemeControls();
      saveLocalState();
    }

    function updateCustomThemeShape(themeId, shapeId) {
      const theme = customThemeById(themeId);
      if (!theme || !SHAPE_PROFILES.some((profile) => profile.id === shapeId)) return;
      theme.shape = shapeId;
      if (state.settings.activeTheme === themeId) applyTheme(themeId);
      saveLocalState();
      if (state.activeScene === "options") renderScene();
    }

    function updateCustomThemeColor(themeId, colorField, color) {
      const theme = customThemeById(themeId);
      if (!theme || !THEME_COLOR_FIELDS.includes(colorField)) return;
      theme.colors[colorField] = color;
      if (state.settings.activeTheme === themeId) applyTheme(themeId);
      saveLocalState();
    }

    function toggleFullScreen() {
      const doc = window.document;
      const docEl = doc.documentElement;
      const requestFull = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
      const exitFull = doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
      const isFull = doc.fullscreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement;

      if (!isFull && requestFull) {
        Promise.resolve(requestFull.call(docEl)).catch((error) => {
          console.error("Unable to enter fullscreen mode.", error);
          alert("Unable to enter fullscreen mode: " + error);
        });
      } else if (isFull && exitFull) {
        Promise.resolve(exitFull.call(doc)).catch((error) => {
          console.error("Unable to exit fullscreen mode.", error);
          alert("Unable to exit fullscreen mode: " + error);
        });
      } else {
        alert("Fullscreen mode is not supported by this browser.");
      }
    }

    function syncFullScreenButton() {
      const button = document.getElementById("fullscreen-btn");
      if (!button) return;
      const isFull = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
      button.textContent = isFull ? "EXIT" : "FULL";
      button.setAttribute("aria-label", isFull ? "Exit fullscreen mode" : "Enter fullscreen mode");
    }

    document.addEventListener("fullscreenchange", syncFullScreenButton);
    document.addEventListener("webkitfullscreenchange", syncFullScreenButton);
    document.addEventListener("MSFullscreenChange", syncFullScreenButton);

    function updateMeta(field, val) {
      state.character[field] = val.trim();
      saveLocalState();
    }

    function uploadCharacterImage(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        if (typeof e.target.result !== "string") {
          alert("Could not load the selected portrait image.");
          return;
        }
        state.character.portrait = e.target.result;
        saveLocalState();
        renderScene();
      };
      reader.onerror = () => {
        alert("Could not read the selected portrait image.");
      };
      reader.readAsDataURL(file);
    }

    function exportCharacterImage() {
      const src = state.character.portrait;
      if (!src) return;
      const a = document.createElement("a");
      a.href = src;
      const extMatch = src.match(/^data:image\/([a-zA-Z0-9+.-]+);/);
      const ext = extMatch ? extMatch[1].replace("jpeg", "jpg") : "png";
      a.download = `${(state.character.name || "Character").replace(/\s+/g, "_")}_Portrait.${ext}`;
      a.click();
    }

    function clearCharacterImage() {
      state.character.portrait = "";
      saveLocalState();
      renderScene();
    }

    function stepPool(poolKey, delta) {
      state.pools[poolKey] = (Number(state.pools[poolKey]) || 0) + delta;
      if (poolKey === "momentum" || poolKey === "threat") triggerTableSync();
      else saveLocalState();
      renderTopHeaderAndStats();
    }

    function setPool(poolKey, val) {
      state.pools[poolKey] = Number(val) || 0;
      if (poolKey === "momentum" || poolKey === "threat") triggerTableSync();
      else saveLocalState();
    }

    function updateBaseStat(group, key, val) {

    function bytesToBase64Url(bytes) {
      let binary = "";
      bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function base64UrlToBytes(value) {
      let base64 = value.replace(/-/g, "+").replace(/_/g, "/");
      while (base64.length % 4) base64 += "=";
      const binary = atob(base64);
      return Uint8Array.from(binary, (char) => char.charCodeAt(0));
    }

    async function encodePartyCode(payload) {
      const json = JSON.stringify(payload);
      const bytes = new TextEncoder().encode(json);
      if ("CompressionStream" in window) {
        const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate"));
        const compressed = new Uint8Array(await new Response(stream).arrayBuffer());
        return `LCARS1C.${bytesToBase64Url(compressed)}`;
      }
      return `LCARS1R.${bytesToBase64Url(bytes)}`;
    }

    async function decodePartyCode(code) {
      const match = String(code || "").trim().match(/^LCARS1([CR])\.([A-Za-z0-9_-]+)$/);
      if (!match) throw new Error("That code is not in the LCARS party-sync format.");
      let bytes = base64UrlToBytes(match[2]);
      if (match[1] === "C") {
        if (!("DecompressionStream" in window)) throw new Error("This browser cannot read compressed party-sync codes.");
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
        bytes = new Uint8Array(await new Response(stream).arrayBuffer());
      }
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    /** Hover (desktop) + long-press (touch) explanations for data-tip elements. */
    function initLcarsTips() {
      const tip = document.getElementById("lcars-tip");
      if (!tip) return;

      let pressTimer = null;
      let activeEl = null;
      let suppressClick = false;

      function placeTip(x, y) {
        const pad = 8;
        const tw = tip.offsetWidth || 200;
        const th = tip.offsetHeight || 40;
        let left = x + 14;
        let top = y + 18;
        if (left + tw > window.innerWidth - pad) left = x - tw - 10;
        if (top + th > window.innerHeight - pad) top = y - th - 10;
        tip.style.left = Math.max(pad, left) + "px";
        tip.style.top = Math.max(pad, top) + "px";
      }

      function showTip(el, x, y) {
        const text = el.getAttribute("data-tip");
        if (!text) return;
        tip.textContent = text;
        tip.hidden = false;
        activeEl = el;
        placeTip(x, y);
      }

      function hideTip() {
        tip.hidden = true;
        activeEl = null;
      }

      const HOVER_DELAY_MS = 700;
      let hoverTimer = null;
      let hoverEl = null;
      let hoverPos = { x: 0, y: 0 };

      function cancelHover() {
        clearTimeout(hoverTimer);
        hoverTimer = null;
        hoverEl = null;
      }

      document.addEventListener("pointerover", (e) => {
        if (e.pointerType === "touch") return;
        const el = e.target.closest("[data-tip]");
        if (!el || el === hoverEl || el === activeEl) return;
        cancelHover();
        hideTip();
        hoverEl = el;
        hoverPos = { x: e.clientX, y: e.clientY };
        hoverTimer = setTimeout(() => {
          if (hoverEl) showTip(hoverEl, hoverPos.x, hoverPos.y);
          hoverTimer = null;
        }, HOVER_DELAY_MS);
      });

      document.addEventListener("pointerout", (e) => {
        if (e.pointerType === "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el && !el.contains(e.relatedTarget)) {
          cancelHover();
          hideTip();
        }
      });

      document.addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "touch") {
          cancelHover();
          hideTip();
        }
      });

      const HOLD_MS = 480;
      const MOVE_TOLERANCE_PX = 10;
      let pressStart = null;
      let hideTimer = null;

      function cancelPress() {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
        pressStart = null;
      }

      document.addEventListener("pointermove", (e) => {
        if (e.pointerType === "touch") {
          if (pressStart && Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > MOVE_TOLERANCE_PX) {
            cancelPress();
          }
          return;
        }
        if (hoverEl) hoverPos = { x: e.clientX, y: e.clientY };
        if (!activeEl || tip.hidden) return;
        placeTip(e.clientX, e.clientY);
      }, { passive: true });

      document.addEventListener("pointerdown", (e) => {
        window.lcarsLastPointer = e.pointerType;
        suppressClick = false;
        if (e.pointerType !== "touch") return;
        cancelPress();
        const holdEl = e.target.closest("[data-hold]");
        const tipEl = e.target.closest("[data-tip]");
        if (!holdEl && !tipEl) return;
        pressStart = { x: e.clientX, y: e.clientY };
        pressTimer = setTimeout(() => {
          pressTimer = null;
          suppressClick = true;
          if (holdEl) {
            runHoldAction(holdEl.getAttribute("data-hold"));
          } else {
            showTip(tipEl, pressStart.x, pressStart.y);
            clearTimeout(hideTimer);
            hideTimer = setTimeout(hideTip, 2600);
          }
        }, HOLD_MS);
      });

      document.addEventListener("pointerup", cancelPress);

      document.addEventListener("pointercancel", () => {
        cancelPress();
        suppressClick = false;
        hideTip();
      });

      // Touch long-press must not open the native context menu / callout
      document.addEventListener("contextmenu", (e) => {
        if (window.lcarsLastPointer === "touch" && e.target.closest("[data-tip],[data-hold]")) {
          e.preventDefault();
        }
      });

      document.addEventListener("click", (e) => {
        if (!suppressClick) return;
        e.preventDefault();
        e.stopPropagation();
        suppressClick = false;
      }, true);
    }

    /** Long-press actions for touch, declared as data-hold="kind:key". */
    function runHoldAction(action) {
      const [kind, key] = String(action || "").split(":");
      if (kind === "breach" && key) stepShipBreach(key, -1);
    }

    // Initialize on load
    window.addEventListener("DOMContentLoaded", async () => {
      initLcarsTips();

      const legacyTheme = localStorage.getItem("lcars_looseleaf_theme");

      const savedState = localStorage.getItem("lcars_looseleaf_state_v1");
      if (savedState) {
        try {
          state = JSON.parse(savedState);
          const savedStateTheme = state.settings && state.settings.activeTheme;
          ensureAppSettings(); syncActiveDictionary(state);
          applyTheme(savedStateTheme || legacyTheme || "classic-tng");
          renderAll();
          return;
        } catch (e) { }
      }

      if (legacyTheme) state.settings.activeTheme = legacyTheme;
      applyTheme(state.settings.activeTheme);

      // Decode pre-loaded character URL automatically on first launch
      try {
        const decoded = await decodeStaUrlString(PRELOADED_CHAR_URL);
        applyDecodedStaPayload(decoded);
      } catch (e) {
        renderAll();
      }
    });
  </script>
</body>

</html>
